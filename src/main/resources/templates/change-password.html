<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div th:replace="~{navbar}"></div>
<div class="container mt-5" style="max-width:420px;">
    <div class="card shadow">
        <div class="card-body">
            <h4 class="text-center mb-4">Đổi mật khẩu</h4>
            <form th:action="@{|/auth/forgot/change/${userId}|}" method="post">
                <input name="email" class="form-control mb-3" placeholder="Email" th:value="${email}" th:readonly="${isValid}">
                <input name="newPassword" class="form-control mb-3" placeholder="Mật khẩu mới">
                <button type="submit" class="btn btn-primary w-100">Đổi mật khẩu</button>
            </form>
            <div th:if="${message}" class="alert alert-danger mt-3" role="alert">
                <span th:text="${message}"></span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
